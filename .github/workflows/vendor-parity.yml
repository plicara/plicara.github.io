name: vendor parity

# The brand files in this repo are COPIES of files generated in
# plicara-brand (see tools/vendor.py for the manifest). Nothing checked
# that they matched, and they drifted twice: the site hand-edited the favicon
# and small marks without sending the change upstream, and a palette repaint
# landed upstream while the site kept shipping the previous one.
#
# The first version of this job read the private foundation_lab and needed a
# FOUNDATION_LAB_TOKEN secret. The secret was never set, so the job skipped
# every real step and reported success -- a guard that was inert from the day
# it landed, discovered only when someone read the step list of a "passing"
# run. The brand was split into the public plicara-brand on 2026-08-20 so
# that this job needs no secret, has no skip path, and cannot silently
# degrade into green again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out plicara-brand
        uses: actions/checkout@v4
        with:
          repository: plicara/plicara-brand
          path: plicara-brand

      - uses: astral-sh/setup-uv@v6

      - name: Compare the vendored copies
        id: check
        continue-on-error: true
        run: |
          cd site
          uv run --locked python tools/vendor.py --check --upstream ../plicara-brand \
            | tee "$GITHUB_WORKSPACE/parity.txt"

      - name: Report
        run: |
          {
            echo "### Vendor parity"
            echo ""
            echo '```'
            cat "$GITHUB_WORKSPACE/parity.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            echo "These files are copies, not sources. Change them in plicara-brand," >> "$GITHUB_STEP_SUMMARY"
            echo "then run \`uv run --locked python tools/vendor.py --sync\` here." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
